name: Build and Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package zip
        run: |
          zip -r logseq-kpm-property-rotator.zip \
            dist/ \
            icon.svg \
            package.json \
            README.md \
            LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: logseq-kpm-property-rotator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
